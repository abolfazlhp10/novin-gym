      summary: Delete FAQ (Admin)
      description: |
        Delete a specific FAQ entry by ID.
        This endpoint requires admin authentication and role.
      operationId: deleteFaq
      security:
        - BearerAuth: []
      parameters:
        - name: faq
          in: path
          required: true
          schema:
            type: integer
          description: FAQ ID
          example: 1
      responses:
        '200':
          description: FAQ deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                faqDeleteSuccess:
                  summary: Successful FAQ deletion
                  value:
                    message: "سوال و جواب با موفقیت حذف شد"
                    data: []
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    message: "Unauthenticated."
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Insufficient permissions
                  value:
                    message: "This action is unauthorized."
        '404':
          description: FAQ not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: FAQ not found
                  value:
                    message: "No query results for model [Modules\\Support\\Models\\Faq] 999"

  /admin/feedbacks:
