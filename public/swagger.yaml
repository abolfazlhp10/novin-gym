                          updated_at: "2025-08-31T10:36:00.000000Z"
                      first_page_url: "http://localhost:8000/api/V1/admin/feedbacks?page=1"
                      from: 1
                      last_page: 1
                      last_page_url: "http://localhost:8000/api/V1/admin/feedbacks?page=1"
                      links:
                        - url: null
                          label: "&laquo; Previous"
                          active: false
                        - url: "http://localhost:8000/api/V1/admin/feedbacks?page=1"
                          label: "1"
                          active: true
                        - url: null
                          label: "Next &raquo;"
                          active: false
                      next_page_url: null
                      path: "http://localhost:8000/api/V1/admin/feedbacks"
                      per_page: 10
                      prev_page_url: null
                      to: 2
                      total: 2
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    message: "Unauthenticated."
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Insufficient permissions
                  value:
                    message: "This action is unauthorized."

  /admin/feedbacks/{feedback}:
    get:
      tags:
        - Support
      summary: Get specific feedback (Admin)
      description: |
        Retrieve a specific feedback by ID for admin management.
        This endpoint requires admin authentication and role.
      operationId: getAdminFeedback
      security:
        - BearerAuth: []
      parameters:
        - name: feedback
          in: path
          required: true
          schema:
            type: integer
          description: Feedback ID
          example: 1
      responses:
        '200':
          description: Feedback retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackDetailResponse'
              examples:
                adminFeedbackSuccess:
                  summary: Successful admin feedback detail response
                  value:
                    message: "بازخورد با موفقیت دریافت شد "
                    data:
                      id: 1
                      user_id: 1
                      feedback: "برنامه تمرینی بسیار عالی بود و نتایج خوبی گرفتم. ممنون از تیم پشتیبانی."
                      created_at: "2025-08-31T10:35:00.000000Z"
                      updated_at: "2025-08-31T10:35:00.000000Z"
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    message: "Unauthenticated."
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Insufficient permissions
                  value:
                    message: "This action is unauthorized."
        '404':
          description: Feedback not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Feedback not found
                  value:
                    message: "No query results for model [Modules\\Support\\Models\\Feedback] 999"

components:
  schemas:
    RegisterUserRequest:
      type: object
      required:
        - first_name
        - last_name
        - phone_number
        - gym_name
      properties:
        first_name:
          type: string
          minLength: 3
          maxLength: 255
          description: User's first name (minimum 3 characters, required)
          example: "علی"
        last_name:
          type: string
          minLength: 3
          maxLength: 255
          description: User's last name (minimum 3 characters, required)
          example: "احمدی"
        phone_number:
          type: string
          pattern: "^09\\d{9}$"
          maxLength: 11
          description: Iranian mobile phone number (must start with 09 and be 11 digits, must be unique in users table, required)
          example: "09123456789"
        gym_name:
          type: string
          minLength: 3
          maxLength: 255
          description: Name of the gym (minimum 3 characters, required)
          example: "باشگاه ورزشی نوین"
        logo:
          type: string
          format: binary
          description: Gym logo image file (optional, max 5MB, formats (png, jpg, jpeg))
          nullable: true
        address:
          type: string
          minLength: 3
          description: Gym address (optional, minimum 3 characters if provided)
          nullable: true
          example: "تهران، خیابان ولیعصر، پلاک 123"

    SendOtpRequest:
      type: object
      required:
        - phone_number
      properties:
        phone_number:
          type: string
          pattern: "^09\\d{9}$"
          maxLength: 11
          description: Iranian mobile phone number (must start with 09 and be 11 digits)
          example: "09123456789"

    LoginRequest:
      type: object
      required:
        - phone_number
        - otp_code
      properties:
        phone_number:
          type: string
          pattern: "^09\\d{9}$"
          maxLength: 11
          description: Iranian mobile phone number (must start with 09 and be 11 digits)
          example: "09123456789"
        otp_code:
          type: integer
          minimum: 10000
          maximum: 99999
          description: 5-digit OTP code received via SMS
          example: 12345

    User:
      type: object
      properties:
        id:
          type: integer
          description: Unique user identifier
          example: 1
        first_name:
          type: string
          description: User's first name
          example: "علی"
        last_name:
          type: string
          description: User's last name
          example: "احمدی"
        phone_number:
          type: string
          description: User's phone number
          example: "09123456789"
        created_at:
          type: string
          description: User creation timestamp in Jalali format (Y/m/d H:i)
          example: "1404/04/26 15:30"
        updated_at:
          type: string
          description: User last update timestamp in Jalali format (Y/m/d H:i)
          example: "1404/04/26 15:30"
        gym:
          $ref: '#/components/schemas/Gym'

    Gym:
      type: object
      properties:
        id:
          type: integer
          description: Unique gym identifier
          example: 1
        name:
          type: string
          description: Gym name
          example: "باشگاه ورزشی نوین"
        user_id:
          type: integer
          description: Associated user ID
          example: 1
        logo:
          type: string
          nullable: true
          description: Path to gym logo file (stored in public/storage/gyms/logos)
          example: "gyms/logos/logo_123.png"
        address:
          type: string
          nullable: true
          description: Gym address
          example: "تهران، خیابان ولیعصر، پلاک 123"
        created_at:
          type: string
          description: Gym creation timestamp in Jalali format (Y/m/d H:i)
          example: "1404/04/26 15:30"
        updated_at:
          type: string
          description: Gym last update timestamp in Jalali format (Y/m/d H:i)
          example: "1404/04/26 15:30"

    LoginSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/User'
                - type: object
                  properties:
                    token:
                      type: string
                      description: Sanctum authentication token
                      example: "1|abcdef1234567890abcdef1234567890abcdef1234567890"

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          description: Success message
          example: "عملیات با موفقیت انجام شد"
        data:
          description: Response data (can be object, array, or null)
          example: {}

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: "خطا در انجام عملیات"

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Validation error message
          example: "The given data was invalid."
        errors:
          type: object
          description: Field-specific validation errors
          additionalProperties:
            type: array
            items:
              type: string
          example:
            phone_number:
              - "The phone number has already been taken."
            first_name:
              - "The first name field is required."

    RegisterSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserWithGym'
          description: Successful registration response with user and gym data

    GetMeSuccessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserWithGym'
          description: Successful get-me response with current user and gym data

    UserWithGym:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            gym:
              $ref: '#/components/schemas/Gym'
          description: User model with loaded gym relationship

    # Support Module Schemas
    Faq:
      type: object
      properties:
        id:
          type: integer
          description: Unique FAQ identifier
          example: 1
        question:
          type: string
          description: FAQ question
          example: "چگونه می‌توانم برنامه تمرینی خود را دریافت کنم؟"
        answer:
          type: string
          description: FAQ answer
          example: "برای دریافت برنامه تمرینی، ابتدا باید در سیستم ثبت نام کنید و سپس از بخش برنامه‌ها، برنامه مورد نظر خود را انتخاب کنید."
        created_at:
          type: string
          format: date-time
          description: FAQ creation timestamp
          example: "2025-08-31T10:32:00.000000Z"
        updated_at:
          type: string
          format: date-time
          description: FAQ last update timestamp
          example: "2025-08-31T10:32:00.000000Z"

    Feedback:
      type: object
      properties:
        id:
          type: integer
          description: Unique feedback identifier
          example: 1
        user_id:
          type: integer
          description: ID of the user who submitted the feedback
          example: 1
        feedback:
          type: string
          description: Feedback content
          example: "برنامه تمرینی بسیار عالی بود و نتایج خوبی گرفتم. ممنون از تیم پشتیبانی."
        created_at:
          type: string
          format: date-time
          description: Feedback creation timestamp
          example: "2025-08-31T10:35:00.000000Z"
        updated_at:
          type: string
          format: date-time
          description: Feedback last update timestamp
          example: "2025-08-31T10:35:00.000000Z"

    FaqStoreRequest:
      type: object
      required:
        - question
        - answer
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
          description: FAQ question (required, max 1000 characters)
          example: "آیا امکان تغییر برنامه تمرینی وجود دارد؟"
        answer:
          type: string
          minLength: 1
          maxLength: 5000
          description: FAQ answer (required, max 5000 characters)
          example: "بله، شما می‌توانید با مراجعه به بخش برنامه‌ها، برنامه تمرینی خود را تغییر دهید."

    FeedbackStoreRequest:
      type: object
      required:
        - feedback
      properties:
        feedback:
          type: string
          minLength: 1
          maxLength: 2000
          description: Feedback content (required, max 2000 characters)
          example: "برنامه تمرینی بسیار عالی بود و نتایج خوبی گرفتم. ممنون از تیم پشتیبانی."

    FaqListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Faq'
          description: Successful FAQ list response

    FaqCreateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Faq'
          description: Successful FAQ creation response

    FeedbackCreateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Feedback'
          description: Successful feedback creation response

    FeedbackDetailResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Feedback'
          description: Successful feedback detail response

    FeedbackListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaginatedFeedbackData'
          description: Successful feedback list response with pagination

    PaginatedFeedbackData:
      type: object
      properties:
        current_page:
          type: integer
          description: Current page number
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/Feedback'
          description: Array of feedback items
        first_page_url:
          type: string
          nullable: true
          description: URL to first page
          example: "http://localhost:8000/api/V1/admin/feedbacks?page=1"
        from:
          type: integer
          nullable: true
          description: Starting item number
          example: 1
        last_page:
          type: integer
          description: Last page number
          example: 1
        last_page_url:
          type: string
          nullable: true
          description: URL to last page
          example: "http://localhost:8000/api/V1/admin/feedbacks?page=1"
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
                description: Link URL
              label:
                type: string
                description: Link label
                example: "1"
              active:
                type: boolean
                description: Whether this is the active page
          description: Pagination links
        next_page_url:
          type: string
          nullable: true
          description: URL to next page
        path:
          type: string
          description: Base path for pagination
          example: "http://localhost:8000/api/V1/admin/feedbacks"
        per_page:
          type: integer
          description: Items per page
          example: 10
        prev_page_url:
          type: string
          nullable: true
          description: URL to previous page
        to:
          type: integer
          nullable: true
          description: Ending item number
          example: 2
        total:
          type: integer
          description: Total number of items
          example: 2

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Sanctum authentication token. 
        Include the token in the Authorization header as 'Bearer {token}'.
        The token is returned after successful login.

security:
  - BearerAuth: []

    parameters:
    PhoneNumberParam:
      name: phone_number
      in: path
      required: true
      schema:
        type: string
        pattern: "^09\\d{9}$"
      description: Iranian mobile phone number
      example: "09123456789"

    examples:
      RegisterUserExample:
        summary: Complete user registration example
        value:
          first_name: "علی"
          last_name: "احمدی"
          phone_number: "09123456789"
          gym_name: "باشگاه ورزشی نوین"
          logo: "(binary file)"
          address: "تهران، خیابان ولیعصر، پلاک 123"

      RegisterUserMinimalExample:
        summary: Minimal user registration example
        value:
          first_name: "علی"
          last_name: "احمدی"
          phone_number: "09123456789"
          gym_name: "باشگاه ورزشی نوین"

      LoginExample:
        summary: Complete login example
        value:
          phone_number: "09123456789"
          otp_code: 12345

    callbacks:
      OtpExpiration:
      '{$request.body#/phone_number}':
        post:
          summary: OTP expiration callback
          description: Called when OTP expires (after 2 minutes)
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    phone_number:
                      type: string
                    expired_at:
                      type: string
                      format: date-time
          responses:
            '200':
              description: OTP expiration acknowledged 