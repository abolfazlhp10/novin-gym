openapi: 3.0.3
info:
  title: Novin Gym API
  description: |
    API for Novin Gym application 
  
servers:
  - url: http://localhost:8000/api/V1
    description: Development server

tags:
  - name: Authentication
    description: User authentication and registration endpoints
  - name: Support
    description: FAQ and Feedback management endpoints


paths:
  /register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: |
        Register a new coach user with gym information. 
        The user will be automatically assigned the 'coach' role.
        A gym record will be created and associated with the user.
        
        **Features:**
        - Creates user with first name, last name, and phone number
        - Automatically assigns 'coach' role using Spatie Laravel Permission
        - Creates associated gym record with name, optional logo, and address
        - Uses database transaction for data integrity
        - Returns user data with gym information and Jalali formatted timestamps
        
        **Technical Details:**
        - Content-Type: multipart/form-data (supports file uploads)
        - Database transaction ensures data consistency
        - Phone number uniqueness validation against users table
        - File storage in public/storage/gyms/logos directory
        - Timestamps converted to Jalali calendar format
        - Role assignment using Spatie Laravel Permission package
        - Automatic gym creation and user association
      operationId: registerUser
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            examples:
              validRegistration:
                summary: Valid registration data
                value:
                  first_name: "علی"
                  last_name: "احمدی"
                  phone_number: "09123456789"
                  gym_name: "باشگاه ورزشی نوین"
                  logo: "(binary file)"
                  address: "تهران، خیابان ولیعصر، پلاک 123"
              minimalRegistration:
                summary: Minimal registration data (without optional fields)
                value:
                  first_name: "علی"
                  last_name: "احمدی"
                  phone_number: "09123456789"
                  gym_name: "باشگاه ورزشی نوین"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
              examples:
                registrationSuccess:
                  summary: Successful registration response
                  value:
                    message: "ثبت نام با موفقیت انجام شد "
                    data:
                      id: 1
                      first_name: "علی"
                      last_name: "احمدی"
                      phone_number: "09123456789"
                      created_at: "1404/04/26 15:30"
                      updated_at: "1404/04/26 15:30"
                      gym:
                        id: 1
                        name: "باشگاه ورزشی نوین"
                        logo: null
                        address: null
                        created_at: "1404/04/26 15:30"
                        updated_at: "1404/04/26 15:30"
                registrationWithLogo:
                  summary: Successful registration with logo and address
                  value:
                    message: "ثبت نام با موفقیت انجام شد "
                    data:
                      id: 1
                      first_name: "علی"
                      last_name: "احمدی"
                      phone_number: "09123456789"
                      created_at: "1404/04/26 15:30"
                      updated_at: "1404/04/26 15:30"
                      gym:
                        id: 1
                        name: "باشگاه ورزشی نوین"
                        logo: "gyms/logos/logo_123.png"
                        address: "تهران، خیابان ولیعصر، پلاک 123"
                        created_at: "1404/04/26 15:30"
                        updated_at: "1404/04/26 15:30"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                validationError:
                  summary: Validation error response
                  value:
                    message: "The given data was invalid."
                    errors:
                      first_name:
                        - "The first name field is required."
                      last_name:
                        - "The last name field is required."
                      phone_number:
                        - "The phone number field is required."
                        - "The phone number format is invalid."
                        - "The phone number has already been taken."
                      gym_name:
                        - "The gym name field is required."
                        - "The gym name must be at least 3 characters."
                phoneNumberExists:
                  summary: Phone number already exists
                  value:
                    message: "The given data was invalid."
                    errors:
                      phone_number:
                        - "The phone number has already been taken."
                invalidPhoneFormat:
                  summary: Invalid phone number format
                  value:
                    message: "The given data was invalid."
                    errors:
                      phone_number:
                        - "The phone number format is invalid."
                fieldLengthError:
                  summary: Field length validation error
                  value:
                    message: "The given data was invalid."
                    errors:
                      first_name:
                        - "The first name must be at least 3 characters."
                      last_name:
                        - "The last name must be at least 3 characters."
                      gym_name:
                        - "The gym name must be at least 3 characters."
                      address:
                        - "The address must be at least 3 characters."
                invalidLogo:
                  summary: Invalid logo file
                  value:
                    message: "The given data was invalid."
                    errors:
                      logo:
                        - "The logo must be an image."
                        - "The logo must be a file of type: png, jpg, jpeg."
                        - "The logo may not be greater than 5120 kilobytes."
                databaseError:
                  summary: Database constraint error
                  value:
                    message: "The given data was invalid."
                    errors:
                      phone_number:
                        - "The phone number has already been taken."
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  summary: Server error response
                  value:
                    message: "ارور در ثبت نام کاربر !"
                databaseTransactionError:
                  summary: Database transaction failed
                  value:
                    message: "ارور در ثبت نام کاربر !"

  /send-otp:
    post:
      tags:
        - Authentication
      summary: Send OTP to phone number
      description: |
        Send a one-time password (OTP) to the specified phone number.
        The OTP is valid for 2 minutes and can be used for login.
        
        **Note:** In testing environment, the OTP code is always '12345' (configurable).
      operationId: sendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
            examples:
              validPhoneNumber:
                summary: Valid phone number
                value:
                  phone_number: "09123456789"
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                otpSentSuccess:
                  summary: OTP sent successfully
                  value:
                    message: "رمز یکبار مصرف با موفقیت ارسال شد"
                    data: []
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                phoneNotFound:
                  summary: Phone number not found
                  value:
                    message: "The given data was invalid."
                    errors:
                      phone_number:
                        - "The selected phone number is invalid."
        '500':
          description: SMS service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                smsError:
                  summary: SMS service error
                  value:
                    message: "ارور در ارسال رمز یکبار مصرف"

  /login:
    post:
      tags:
        - Authentication
      summary: Login user with OTP
      description: |
        Authenticate user using phone number and OTP code.
        Upon successful authentication, a Sanctum token is generated and returned.
        The token is also set as an HTTP-only cookie for enhanced security.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              validLogin:
                summary: Valid login credentials
                value:
                  phone_number: "09123456789"
                  otp_code: 12345
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
              examples:
                loginSuccess:
                  summary: Successful login response
                  value:
                    message: "ورود با موفقیت انجام شد"
                    data:
                      id: 1
                      first_name: "علی"
                      last_name: "احمدی"
                      phone_number: "09123456789"
                      created_at: "2025-07-17T11:30:00.000000Z"
                      updated_at: "2025-07-17T11:30:00.000000Z"
                      token: "1|abcdef1234567890abcdef1234567890abcdef1234567890"
          headers:
            Set-Cookie:
              description: Authentication token cookie
              schema:
                type: string
              example: "auth_token=1|abcdef1234567890abcdef1234567890abcdef1234567890; HttpOnly; Secure; SameSite=Strict"
        '422':
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidOtp:
                  summary: Invalid OTP response
                  value:
                    message: "کد یکبار مصرف نامعتبر است"

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout current user
      description: |
        Revoke the current Sanctum access token used for this request and clear the authentication cookie.
        Only the current token is revoked. To revoke all sessions, call a dedicated endpoint that deletes all tokens.
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              description: Clears authentication token cookie
              schema:
                type: string
              example: "auth_token=; Max-Age=0; HttpOnly; Secure; SameSite=Strict"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                logoutSuccess:
                  summary: Successful logout response
                  value:
                    message: "خروج با موفقیت انجام شد"
                    data: []
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized
                  value:
                    message: "Unauthenticated."

  /get-me:
    get:
      tags:
        - Authentication
      summary: Get current user information
      description: |
        Retrieve the authenticated user's profile information including personal details and associated gym data.
        This endpoint requires a valid Sanctum authentication token.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMeSuccessResponse'
              examples:
                userInfoSuccess:
                  summary: Successful user info response
                  value:
                    message: "اطلاعات کاربر با موفقیت دریافت شد"
                    data:
                      id: 1
                      first_name: "علی"
                      last_name: "احمدی"
                      phone_number: "09123456789"
                      created_at: "1404/04/26 15:30"
                      updated_at: "1404/04/26 15:30"
                      gym:
                        id: 1
                        name: "باشگاه ورزشی نوین"
                        logo: "gyms/logos/logo_123.png"
                        address: "تهران، خیابان ولیعصر، پلاک 123"
                        created_at: "1404/04/26 15:30"
                        updated_at: "1404/04/26 15:30"
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    message: "User not authenticated"

  # Support Module Endpoints
  /faq:
    get:
      tags:
        - Support
      summary: Get all FAQs
      description: |
        Retrieve all frequently asked questions (FAQs) for users.
        This endpoint is publicly accessible and does not require authentication.
      operationId: getFaqs
      responses:
        '200':
          description: FAQs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqListResponse'
              examples:
                faqListSuccess:
                  summary: Successful FAQ list response
                  value:
                    message: "لیست سوالات متداول با موفقیت دریافت شد "
                    data:
                      - id: 1
                        question: "چگونه می‌توانم برنامه تمرینی خود را دریافت کنم؟"
                        answer: "برای دریافت برنامه تمرینی، ابتدا باید در سیستم ثبت نام کنید و سپس از بخش برنامه‌ها، برنامه مورد نظر خود را انتخاب کنید."
                        created_at: "2025-08-31T10:32:00.000000Z"
                        updated_at: "2025-08-31T10:32:00.000000Z"
                      - id: 2
                        question: "آیا امکان تغییر برنامه تمرینی وجود دارد؟"
                        answer: "بله، شما می‌توانید با مراجعه به بخش برنامه‌ها، برنامه تمرینی خود را تغییر دهید."
                        created_at: "2025-08-31T10:33:00.000000Z"
                        updated_at: "2025-08-31T10:33:00.000000Z"

  /feedback:
    post:
      tags:
        - Support
      summary: Submit feedback
      description: |
        Submit user feedback to the support team.
        This endpoint requires authentication and automatically associates the feedback with the authenticated user.
      operationId: submitFeedback
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackStoreRequest'
            examples:
              validFeedback:
                summary: Valid feedback submission
                value:
                  feedback: "برنامه تمرینی بسیار عالی بود و نتایج خوبی گرفتم. ممنون از تیم پشتیبانی."
      responses:
        '201':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackCreateResponse'
              examples:
                feedbackSuccess:
                  summary: Successful feedback submission
                  value:
                    message: "بازخورد شما با موفقیت ارسال شد"
                    data:
                      id: 1
                      user_id: 1
                      feedback: "برنامه تمرینی بسیار عالی بود و نتایج خوبی گرفتم. ممنون از تیم پشتیبانی."
                      created_at: "2025-08-31T10:35:00.000000Z"
                      updated_at: "2025-08-31T10:35:00.000000Z"
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    message: "Unauthenticated."
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                validationError:
                  summary: Validation error response
                  value:
                    message: "The given data was invalid."
                    errors:
                      feedback:
                        - "The feedback field is required."

  /admin/faqs:
    get:
      tags:
        - Support
      summary: Get all FAQs (Admin)
      description: |
        Retrieve all FAQs for admin management.
        This endpoint requires admin authentication and role.
      operationId: getAdminFaqs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: FAQs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqListResponse'
              examples:
                adminFaqListSuccess:
                  summary: Successful admin FAQ list response
                  value:
                    message: "لیست سوالات متداول با موفقیت دریافت شد "
                    data:
                      - id: 1
                        question: "چگونه می‌توانم برنامه تمرینی خود را دریافت کنم؟"
                        answer: "برای دریافت برنامه تمرینی، ابتدا باید در سیستم ثبت نام کنید و سپس از بخش برنامه‌ها، برنامه مورد نظر خود را انتخاب کنید."
                        created_at: "2025-08-31T10:32:00.000000Z"
                        updated_at: "2025-08-31T10:32:00.000000Z"
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    message: "Unauthenticated."
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Insufficient permissions
                  value:
                    message: "This action is unauthorized."

    post:
      tags:
        - Support
      summary: Create new FAQ (Admin)
      description: |
        Create a new FAQ entry.
        This endpoint requires admin authentication and role.
      operationId: createFaq
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaqStoreRequest'
            examples:
              validFaq:
                summary: Valid FAQ creation
                value:
                  question: "آیا امکان تغییر برنامه تمرینی وجود دارد؟"
                  answer: "بله، شما می‌توانید با مراجعه به بخش برنامه‌ها، برنامه تمرینی خود را تغییر دهید."
      responses:
        '200':
          description: FAQ created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqCreateResponse'
              examples:
                faqCreateSuccess:
                  summary: Successful FAQ creation
                  value:
                    message: "سوال و جواب با موفقیت اضافه شد"
                    data:
                      id: 3
                      question: "آیا امکان تغییر برنامه تمرینی وجود دارد؟"
                      answer: "بله، شما می‌توانید با مراجعه به بخش برنامه‌ها، برنامه تمرینی خود را تغییر دهید."
                      created_at: "2025-08-31T10:40:00.000000Z"
                      updated_at: "2025-08-31T10:40:00.000000Z"
        '401':
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  summary: Unauthorized access
                  value:
                    message: "Unauthenticated."
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  summary: Insufficient permissions
                  value:
                    message: "This action is unauthorized."
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                validationError:
                  summary: Validation error response
                  value:
                    message: "The given data was invalid."
                    errors:
                      question:
                        - "The question field is required."
                      answer:
                        - "The answer field is required."

  /admin/faqs/{faq}:
